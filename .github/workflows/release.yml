name: Release

# Maintain a release PR from Conventional Commits. Merging that PR creates a
# draft release; this workflow tests the tag, publishes the release, and asks
# the Omarchy Plugin Marketplace to verify the new commit.
on:
  push:
    branches: [master]

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Enable auto-merge for the release PR
        if: steps.release.outputs.prs_created == 'true'
        run: gh pr merge --auto --squash "$(jq -r .number <<<"$RELEASE_PR")" --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          RELEASE_PR: ${{ steps.release.outputs.pr }}

  checks:
    needs: release
    if: needs.release.outputs.release_created == 'true'
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.release.outputs.tag_name }}

  publish:
    needs: [release, checks]
    if: needs.release.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish release
        run: gh release edit "$RELEASE_TAG" --draft=false --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.release.outputs.tag_name }}

  marketplace:
    needs: [release, publish]
    if: needs.release.outputs.release_created == 'true' && vars.MARKETPLACE_SUBMITTED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: marketplace-update
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.tag_name }}

      - name: Request marketplace verification of the release commit
        run: python3 tools/marketplace.py --tag "$RELEASE_TAG"
        env:
          GH_TOKEN: ${{ secrets.MARKETPLACE_TOKEN }}
          RELEASE_TAG: ${{ needs.release.outputs.tag_name }}
